name: Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          # In order:
          # * Module download cache
          # * Build cache (Linux)
          # * Build cache (Mac)
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Tests
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # `buf breaking` reads the baseline out of this checkout's origin/main,
          # which the default shallow fetch does not carry.
          fetch-depth: 0

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: Check for breaking changes
        working-directory: proto
        run: buf breaking --against '../.git#ref=origin/main,subdir=proto'

      - name: Regenerate protobuf
        working-directory: proto
        run: buf generate

      - name: Check regenerated protobuf matches the tree
        run: git diff --exit-code pb/
