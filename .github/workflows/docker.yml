name: Build docker image

on:
  pull_request:
  push:
    tags:
      - "v*"
    branches:
      - "main"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build:
    name: Docker image ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]

    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          # 2 commits so a PR merge commit can be diffed against its base (first parent)
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # The base image is the firehose-core release firetron is compiled against,
      # and its multi-arch tag so each platform gets its own firecore.
      - name: Extract Firehose Core version
        id: extract-firecore-version
        run: |
          set -euo pipefail

          version=$(awk '$1 == "github.com/streamingfast/firehose-core" { print $2 }' go.mod)
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=go.mod::github.com/streamingfast/firehose-core must be a release (vX.Y.Z) to have a base image, got '${version}'"
            exit 1
          fi

          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: extract-version
        run: |
          version="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version=${GITHUB_REF#refs/tags/}
          fi

          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"

      # Per-architecture tags added by the image scan gate once the image is clean, so a
      # vulnerable image never gets a release tag. The manifest job needs `<sha7>-<arch>`
      # and the weekly scan needs `<tag>-<arch>`, both are among them.
      - name: Generate docker tags/labels from github build context
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag,suffix=-${{ matrix.architecture }}
            type=sha,prefix=,suffix=-${{ matrix.architecture }}
            type=raw,enable=${{ github.ref == 'refs/heads/main' }},value=main,suffix=-${{ matrix.architecture }}
          flavor: |
            latest=false

      # The only tag pushed by the build: the immutable commit tag the gate scans
      - name: Generate the immutable commit docker tag
        id: sha
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=-${{ matrix.architecture }}
          flavor: |
            latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.sha.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=docker-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.architecture }}
          build-args: |
            FIRECORE_VERSION=${{ steps.extract-firecore-version.outputs.VERSION }}
            VERSION=${{ steps.extract-version.outputs.VERSION }}

      # The image is always built, only the scan is skipped on pull requests that cannot change its contents.
      # Branch/tag pushes always scan (the release gate stays strict). After a clean scan the gate adds
      # the release tags, on findings nothing is promoted. The `push` job below publishes the final
      # tags and manifest, it needs every architecture to pass this scan.
      - name: Scan the image
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        uses: streamingfast/actions/image-scan/gate@v1
        with:
          image: ${{ steps.sha.outputs.tags }}
          promote-tags: ${{ steps.meta.outputs.tags }}
          dockerhub-user: ${{ secrets.DOCKER_SCOUT_USER }}
          dockerhub-password: ${{ secrets.DOCKER_SCOUT_PASSWORD }}
          severities: critical,high
          # Paths that affect the image contents, keep in sync with the Dockerfile COPY/ADD sources
          scan-paths: |
            ^Dockerfile
            ^go\.mod
            ^go\.sum
            ^\.dockerignore
            ^docker/

  push:
    name: Docker manifest
    needs: [docker-build]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04

    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag with alpha, beta or rc in it is a pre-release and must not move `latest`.
      - name: Generate docker tags/labels from github build context
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,enable=${{ github.ref == 'refs/heads/main' }},value=main
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') }}
          sep-tags: ","

      - name: Extract image
        id: image
        run: |
          echo "ID=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest images
        uses: Noelware/docker-manifest-action@0.4.3
        with:
          inputs: "${{ steps.meta.outputs.tags }}"
          images: "${{ steps.image.outputs.ID }}-amd64, ${{ steps.image.outputs.ID }}-arm64"
          push: true

  slack-notifications:
    name: Slack notification
    needs: [push]
    runs-on: ubuntu-24.04
    steps:
      - name: Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: Ilshidur/action-slack@2.1.0
        with:
          args: |
            :done: *${{ github.repository }}* Success building docker image from ${{ github.ref_type }} _${{ github.ref_name }}_ (${{ github.actor }}) :sparkling_heart: ```${{ needs.push.outputs.tags }}```
