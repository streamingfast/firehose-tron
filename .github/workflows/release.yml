---
name: Build, push and release (if tag)

# A release is just a tag push: the same workflow that builds and pushes an image
# for every branch also cuts the GitHub release and bumps the Homebrew formula
# when the ref is a tag. Nothing is ever released from a developer machine.
on:
  push:
    tags:
      - "v*"
    # `**` and not `*`, the latter does not match branch names containing a
    # slash, which is most of them.
    branches:
      - "**"
  workflow_dispatch:

# Jobs that need more than reading the repository ask for it themselves.
permissions:
  contents: read

# A tag run is never cancelled, it is the one that publishes the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Only used to extract the CHANGELOG.md section that becomes the release notes,
  # the release itself is driven by this workflow.
  SFRELEASER_VERSION: v0.13.1
  # Archive and formula name the Homebrew tap already points at. Changing this
  # breaks every published `brew install` URL.
  PROJECT_NAME: firehose-tron

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      is-release: ${{ steps.version.outputs.IS_RELEASE }}
      is-prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}
      has-tap-token: ${{ steps.tap.outputs.HAS_TOKEN }}
      binary-matrix: ${{ steps.matrix.outputs.MATRIX }}
      docker-platforms: ${{ steps.matrix.outputs.DOCKER_PLATFORMS }}
      changelog: ${{ steps.changelog.outputs.CHANGELOG }}

    steps:
      - name: Extract version
        id: version
        run: |
          version="edge-${GITHUB_SHA::7}"
          is_release="false"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            # Only a tag PUSH publishes. workflow_dispatch accepts a tag in its ref
            # selector, and that run is for re-validating the matrix, it must not
            # re-upload assets over a published release or reopen the formula PR.
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              is_release="true"
            fi
          fi

          is_prerelease="false"
          if [[ "${version}" == *alpha* || "${version}" == *beta* || "${version}" == *rc* ]]; then
            is_prerelease="true"
          fi

          {
            echo "VERSION=${version}"
            echo "IS_RELEASE=${is_release}"
            echo "IS_PRERELEASE=${is_prerelease}"
          } >> "$GITHUB_OUTPUT"

      # Secrets are unreadable from a job-level `if`, so the homebrew job reads this
      # output instead. A missing token skips the formula bump with a warning rather
      # than failing the tag: the image and the GitHub release do not depend on it.
      - name: Check tap token is available
        id: tap
        if: steps.version.outputs.IS_RELEASE == 'true' && steps.version.outputs.IS_PRERELEASE == 'false'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${TAP_TOKEN}" ]]; then
            echo "::warning title=Homebrew formula not updated::HOMEBREW_TAP_TOKEN is unset. It needs contents:write and pull-requests:write on streamingfast/homebrew-tap."
            echo "HAS_TOKEN=false" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_TOKEN=true" >> "$GITHUB_OUTPUT"
          fi

      # Cross compiling every platform on each branch push is mostly wasted time,
      # so only a release builds the full set. Everything else builds linux/amd64,
      # enough to catch a broken build. A manual run also builds everything, which
      # is how the full matrix gets validated before a tag is pushed.
      #
      # `archive_arch` is goreleaser's naming, which the tap's URLs already use:
      # amd64 is published as x86_64.
      - name: Compute build matrix
        id: matrix
        env:
          FULL_BUILD: ${{ steps.version.outputs.IS_RELEASE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          matrix=$(cat <<'JSON'
          {"include": [
            {"goos": "linux",  "goarch": "amd64", "archive_arch": "x86_64", "runner": "ubuntu-24.04",     "smoke": true},
            {"goos": "linux",  "goarch": "arm64", "archive_arch": "arm64",  "runner": "ubuntu-24.04-arm", "smoke": true},
            {"goos": "darwin", "goarch": "amd64", "archive_arch": "x86_64", "runner": "ubuntu-24.04",     "smoke": false},
            {"goos": "darwin", "goarch": "arm64", "archive_arch": "arm64",  "runner": "ubuntu-24.04",     "smoke": false}
          ]}
          JSON
          )
          docker_platforms="linux/amd64,linux/arm64"

          if [[ "${FULL_BUILD}" != "true" ]]; then
            matrix=$(jq '{include: [.include[] | select(.goos == "linux" and .goarch == "amd64")]}' <<< "${matrix}")
            docker_platforms="linux/amd64"
          fi

          echo "MATRIX=$(jq --compact-output . <<< "${matrix}")" >> "$GITHUB_OUTPUT"
          echo "DOCKER_PLATFORMS=${docker_platforms}" >> "$GITHUB_OUTPUT"

      # Extracted here rather than in the release job so a tag whose CHANGELOG.md
      # section is missing fails the run before any image is pushed, which is
      # what sfreleaser does when it finds no section for the version.
      - name: Extract changelog section
        id: changelog
        if: steps.version.outputs.IS_RELEASE == 'true'
        # Passed through the environment rather than interpolated into the script,
        # so the token never becomes part of the command line.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          curl -sL "https://github.com/streamingfast/sfreleaser/releases/download/${SFRELEASER_VERSION}/sfreleaser_linux_x86_64.tar.gz" | tar -xz
          chmod +x sfreleaser

          ./sfreleaser changelog extract-section \
            "github://token:${GH_TOKEN}@${GITHUB_REPOSITORY}/${GITHUB_SHA}/CHANGELOG.md" \
            "${VERSION}" \
            --github-output="CHANGELOG:$GITHUB_OUTPUT"

  binaries:
    name: Binary ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    needs: [setup]

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.binary-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The build stage runs natively and cross compiles, so GOOS/GOARCH are
      # passed explicitly and no emulation is ever involved. This is also the only
      # way to produce the darwin binaries, which have no Docker platform.
      - name: Build binary
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: binary
          outputs: type=local,dest=dist
          build-args: |
            GOOS=${{ matrix.goos }}
            GOARCH=${{ matrix.goarch }}
            VERSION=${{ needs.setup.outputs.version }}
          cache-from: type=gha,scope=binary-${{ matrix.goos }}-${{ matrix.goarch }}
          cache-to: type=gha,mode=max,scope=binary-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Inspect binary
        run: |
          chmod +x dist/firetron
          file dist/firetron

      # Each linux job runs on a runner of its own architecture, so the binary it
      # just produced can actually be executed here.
      - name: Smoke test binary
        if: matrix.smoke
        run: dist/firetron --version

      # Released twice: as a bare binary with the platform in its name, and as the
      # `<project>_<goos>_<arch>.tar.gz` holding the binary that the Homebrew
      # formula's `bin.install` names. The archive layout is the tap's contract.
      - name: Package binary
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          ARCHIVE_ARCH: ${{ matrix.archive_arch }}
        run: |
          set -euo pipefail

          archive="${PROJECT_NAME}_${TARGET_OS}_${ARCHIVE_ARCH}.tar.gz"
          cp README.md dist/
          tar -czf "dist/${archive}" -C dist firetron README.md
          tar -tzvf "dist/${archive}"

          mv dist/firetron "dist/firetron_${TARGET_OS}_${TARGET_ARCH}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firetron_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/firetron_*
            dist/${{ env.PROJECT_NAME }}_*.tar.gz
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    # Serial with the binaries on purpose: pushing an image, and moving `latest`
    # with it, for a tag whose binaries failed to build would leave a release
    # half published.
    needs: [setup, binaries]

    permissions:
      contents: read
      packages: write

    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Firehose Core version
        id: extract-firecore-version
        run: |
          docker pull ghcr.io/streamingfast/firehose-core:latest
          echo VERSION=$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.version"}}' 'ghcr.io/streamingfast/firehose-core:latest') >> "$GITHUB_OUTPUT"

      # No QEMU is set up on purpose: the build stage cross compiles natively and
      # the runtime stage only copies a file into the firehose-core base, so
      # nothing foreign is ever executed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Generate docker tags/labels from github build context
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=,enable=true
            type=raw,enable=${{ github.ref == 'refs/heads/main' }},value=main
            type=raw,enable=${{ github.ref == 'refs/heads/develop' }},value=develop
          flavor: |
            latest=${{ needs.setup.outputs.is-release == 'true' && needs.setup.outputs.is-prerelease == 'false' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ needs.setup.outputs.docker-platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            FIRECORE_VERSION=${{ steps.extract-firecore-version.outputs.VERSION }}
            VERSION=${{ needs.setup.outputs.version }}

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: [setup, binaries, docker]
    if: needs.setup.outputs.is-release == 'true'

    permissions:
      contents: write

    steps:
      # docker/build-push-action uploads a build record artifact of its own
      # (<owner>.<repo>.<id>.dockerbuild), so the pattern is required to keep it
      # out of the release assets.
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: firetron_*
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: |
          sha256sum firetron_* "${PROJECT_NAME}"_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: ${{ needs.setup.outputs.changelog }}
          prerelease: ${{ needs.setup.outputs.is-prerelease == 'true' }}

  homebrew:
    name: Homebrew formula
    runs-on: ubuntu-24.04
    needs: [setup, release]
    # Only set on a non-prerelease tag push with the secret present: a prerelease
    # must not become what `brew install firehose-tron` resolves to.
    if: needs.setup.outputs.has-tap-token == 'true'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: firetron_*
          merge-multiple: true

      # Shape and asset URLs are unchanged from the goreleaser-generated formula,
      # so an existing install upgrades in place.
      - name: Render formula
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        working-directory: artifacts
        run: |
          set -euo pipefail

          bare_version="${VERSION#v}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"

          # Resolved before the heredoc: a command substitution that fails inside
          # one does not stop the script, and would silently emit an empty sha256.
          for target in darwin_x86_64 darwin_arm64 linux_x86_64 linux_arm64; do
            file="${PROJECT_NAME}_${target}.tar.gz"
            if [[ ! -f "${file}" ]]; then
              echo "missing release archive ${file}, refusing to publish the formula" >&2
              exit 1
            fi
            declare "sha_${target}=$(sha256sum "${file}" | cut -d' ' -f1)"
          done

          cat > formula.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # Generated by ${GITHUB_REPOSITORY} .github/workflows/release.yml on tag push. DO NOT EDIT.
          class FirehoseTron < Formula
            desc "Firehose and Substreams support for the Tron blockchain"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${bare_version}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.intel?
                url "${base_url}/${PROJECT_NAME}_darwin_x86_64.tar.gz"
                sha256 "${sha_darwin_x86_64}"

                define_method(:install) do
                  bin.install "firetron"
                end
              end
              if Hardware::CPU.arm?
                url "${base_url}/${PROJECT_NAME}_darwin_arm64.tar.gz"
                sha256 "${sha_darwin_arm64}"

                define_method(:install) do
                  bin.install "firetron"
                end
              end
            end

            on_linux do
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "${base_url}/${PROJECT_NAME}_linux_x86_64.tar.gz"
                sha256 "${sha_linux_x86_64}"
                define_method(:install) do
                  bin.install "firetron"
                end
              end
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "${base_url}/${PROJECT_NAME}_linux_arm64.tar.gz"
                sha256 "${sha_linux_arm64}"
                define_method(:install) do
                  bin.install "firetron"
                end
              end
            end
          end
          EOF

          cat formula.rb

      # The tap's default branch refuses direct commits, its protection requires a
      # pull request and passing checks, so the bump goes onto a branch and opens a PR.
      #
      # A cross-repository write, which GITHUB_TOKEN cannot do: HOMEBREW_TAP_TOKEN
      # needs contents:write and pull-requests:write on the tap. The git/contents
      # APIs are used instead of a clone so the tap never has to be checked out.
      - name: Open formula PR against the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.setup.outputs.version }}
          TAP_REPO: streamingfast/homebrew-tap
        working-directory: artifacts
        run: |
          set -euo pipefail

          branch="bump/${PROJECT_NAME}-${VERSION}"
          base=$(gh api "repos/${TAP_REPO}" --jq '.default_branch')
          base_sha=$(gh api "repos/${TAP_REPO}/git/ref/heads/${base}" --jq '.object.sha')

          # Re-running this job after a failure has to land on the branch the first
          # attempt left behind rather than die on an existing ref.
          if gh api "repos/${TAP_REPO}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${TAP_REPO}/git/refs/heads/${branch}" \
              -F sha="${base_sha}" -F force=true
          else
            gh api --method POST "repos/${TAP_REPO}/git/refs" \
              -f ref="refs/heads/${branch}" -f sha="${base_sha}"
          fi

          file_sha=$(gh api "repos/${TAP_REPO}/contents/${PROJECT_NAME}.rb?ref=${branch}" --jq '.sha')

          gh api --method PUT "repos/${TAP_REPO}/contents/${PROJECT_NAME}.rb" \
            -f message="chore: update ${PROJECT_NAME} to ${VERSION}" \
            -f content="$(base64 -w0 formula.rb)" \
            -f sha="${file_sha}" \
            -f branch="${branch}"

          url=$(gh pr list --repo "${TAP_REPO}" --head "${branch}" --state open --json url --jq '.[0].url')
          if [[ -z "${url}" ]]; then
            url=$(gh pr create --repo "${TAP_REPO}" --base "${base}" --head "${branch}" \
              --title "chore: update ${PROJECT_NAME} to ${VERSION}" \
              --body "Formula bump for ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION}.")
          fi

          # The tap has auto-merge disabled, so this PR waits on a human. Until it
          # merges, `brew install` keeps serving the previous version.
          echo "Homebrew formula PR: ${url}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Homebrew formula PR::${url} — merge it or brew stays on the previous version"

  slack-notifications:
    name: Slack notification
    runs-on: ubuntu-24.04
    # `release` is skipped on branch pushes, which is a pass, but on a tag the notice
    # must not claim success while the release itself failed.
    needs: [docker, release]
    if: >-
      always()
      && needs.docker.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')

    steps:
      - name: Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: Ilshidur/action-slack@2.1.0
        with:
          args: |
            :done: *${{ github.repository }}* Success building docker images from ${{ github.ref_type }} _${{ github.ref_name }}_ (${{ github.actor }}) :sparkling_heart: ```${{ needs.docker.outputs.tags }}```
